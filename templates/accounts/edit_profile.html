{% extends 'base.html' %}

{% block title %}Edit Profile - Hum 3 Network{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="glass-panel p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-gradient-to-br from-primary to-secondary rounded-full opacity-20 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-gradient-to-tr from-secondary to-primary rounded-full opacity-20 blur-3xl"></div>

        <div class="relative z-10">
            <div class="flex items-center justify-between mb-8 border-b border-gray-700 pb-4">
                <h2 class="text-2xl md:text-3xl font-extrabold text-white">Edit Profile</h2>
                <a href="{% url 'dashboard' %}" class="text-gray-400 hover:text-white transition flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                
                <div class="flex items-center space-x-6 mb-8">
                    <div class="shrink-0 relative">
                        {% if user.userprofile.avatar %}
                            <img class="h-28 w-28 object-cover rounded-full border-4 border-primary shadow-[0_0_15px_rgba(249,115,22,0.4)]" src="{{ user.userprofile.avatar.url }}" alt="Avatar">
                        {% else %}
                            <div class="h-28 w-28 rounded-full bg-darkBg border-4 border-primary shadow-[0_0_15px_rgba(249,115,22,0.4)] flex items-center justify-center text-3xl md:text-4xl font-bold text-gray-400">
                                {{ user.username|slice:":1"|upper }}
                            </div>
                        {% endif %}
                        <div class="absolute bottom-0 right-0 bg-primary rounded-full p-2 text-white shadow-lg border-2 border-darkBg">
                            <i class="fas fa-camera text-sm"></i>
                        </div>
                    </div>
                    <label class="block w-full max-w-sm">
                        <span class="text-gray-300 font-medium mb-2 block">Profile Photo</span>
                        <input type="file" name="avatar" accept="image/*" class="block w-full text-sm text-gray-400
                            file:mr-4 file:py-2 file:px-4
                            file:rounded-full file:border-0
                            file:text-sm file:font-bold
                            file:bg-primary file:text-white
                            hover:file:bg-secondary cursor-pointer transition
                            bg-darkBg/50 border border-gray-700 rounded-full
                        "/>
                        <p class="text-xs text-gray-500 mt-2">JPG, GIF or PNG. Max size 2MB.</p>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">First Name</label>
                        <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="e.g. Ali" class="w-full bg-darkBg/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Last Name</label>
                        <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="e.g. Khan" class="w-full bg-darkBg/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                        <input type="email" name="email" value="{{ user.email }}" placeholder="e.g. ali@example.com" class="w-full bg-darkBg/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Phone Number</label>
                        <input type="text" name="phone_number" value="{{ user.userprofile.phone_number }}" placeholder="e.g. 03001234567" class="w-full bg-darkBg/50 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">WhatsApp Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fab fa-whatsapp text-green-500"></i>
                            </div>
                            <input type="text" name="whatsapp_number" value="{{ user.userprofile.whatsapp_number }}" placeholder="e.g. +923001234567" class="w-full bg-darkBg/50 border border-gray-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition">
                        </div>
                    </div>
                </div>

                <div class="pt-6 mt-6 border-t border-gray-700 flex items-center gap-4">
                    <button type="submit" class="bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-8 rounded-lg btn-glow shadow-lg flex items-center gap-2">
                        <i class="fas fa-save"></i> Save Profile
                    </button>
                    <a href="{% url 'dashboard' %}" class="text-gray-400 hover:text-white transition px-4 py-3 border border-gray-700 rounded-lg hover:bg-gray-800">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

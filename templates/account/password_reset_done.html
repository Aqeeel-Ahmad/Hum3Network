{% extends "base.html" %}

{% block title %}Email Sent - Hum 3 Network{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="glass-panel p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-gradient-to-br from-primary to-secondary rounded-full opacity-20 blur-3xl"></div>
        <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-gradient-to-tr from-secondary to-primary rounded-full opacity-20 blur-3xl"></div>

        <div class="relative z-10 text-center">
            <div class="w-16 h-16 bg-primary/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-envelope text-2xl md:text-3xl text-primary"></i>
            </div>
            <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2">Check Your Email</h2>
            <p class="text-gray-400 mb-8">We have sent you an e-mail. Please contact us if you do not receive it within a few minutes.</p>

            <a href="{% url 'account_login' %}" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-3 px-4 rounded-lg btn-glow shadow-lg inline-block">
                Return to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
